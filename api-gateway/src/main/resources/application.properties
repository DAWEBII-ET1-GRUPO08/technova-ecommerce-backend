spring.application.name=api-gateway
server.port=8080

spring.config.import=optional:configserver:http://localhost:8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*

#spring.cloud.gateway.routes[0].id=catalog-service
#spring.cloud.gateway.routes[0].uri=lb://catalog-service
#spring.cloud.gateway.routes[0].predicates[0]=Path=/api/products/**

spring.cloud.gateway.server.webflux.routes[0].id=catalog-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://catalog-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/products/**

spring.cloud.gateway.server.webflux.routes[1].id=catalog-categories
spring.cloud.gateway.server.webflux.routes[1].uri=lb://catalog-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/categories/**

spring.cloud.gateway.server.webflux.routes[2].id=inventory-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/inventory/**

spring.cloud.gateway.server.webflux.routes[3].id=identity-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://identity-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[4].id=identity-users
spring.cloud.gateway.server.webflux.routes[4].uri=lb://identity-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[5].id=cart-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://cart-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/cart/**

spring.cloud.gateway.server.webflux.routes[6].id=order-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/orders/**